services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sholidstream
      POSTGRES_USER: sholidstream
      POSTGRES_PASSWORD: sholidstream
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sholidstream -d sholidstream"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sholidstream_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sholidstream_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sholidstream_minio:/data

  stream-worker:
    build: .
    command: ["npm", "run", "worker:start"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sholidstream:sholidstream@postgres:5432/sholidstream
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      STREAM_WORKER_CONCURRENCY: "2"
      STREAM_WORKER_HEARTBEAT_MS: "15000"
      STREAM_WORKER_LEASE_MS: "45000"
      FFMPEG_PATH: /usr/bin/ffmpeg
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sholidstream_postgres:
  sholidstream_redis:
  sholidstream_minio:
